<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekologi & Keanekaragaman Hayati</title>
    <style>
        /* === VARIABEL WARNA & RESET === */
        :root {
            --cream: #FDFBF7;
            --sage-green: #849C7E;
            --light-blue: #A2C4C9;
            --dark-blue: #2C3E50;
            --mahogany: #4A2E2B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--dark-blue); /* Fallback */
            overflow-x: hidden;
            color: var(--dark-blue);
        }

        /* === STRUKTUR HALAMAN (SINGLE PAGE) === */
        .page {
            display: none;
            min-height: 100dvh; /* Menyesuaikan layar HP sempurna */
            width: 100vw;
            padding: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .page.active {
            display: flex;
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === LATAR BELAKANG GRADASI ALAM === */
        #page1 { background: linear-gradient(135deg, var(--light-blue) 0%, var(--sage-green) 100%); }
        #page2 { background: radial-gradient(circle at top left, var(--cream) 0%, var(--light-blue) 100%); }
        #page3 { background: linear-gradient(to bottom right, var(--sage-green), var(--cream)); }
        #page4 { background: linear-gradient(135deg, var(--light-blue), var(--cream), var(--sage-green)); }
        #page5 { background: linear-gradient(to bottom, var(--cream), var(--sage-green)); }
        #page6 { background: radial-gradient(circle at center, var(--light-blue), var(--sage-green)); }
        #page7 { background: linear-gradient(to right, var(--cream), var(--light-blue)); }

        /* === EFEK GLASSMORPHISM KOTAK KONTEN === */
        .glass-box {
            background: rgba(253, 251, 247, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 35px rgba(44, 62, 80, 0.1);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 450px; /* Ukuran pas untuk HP & Tablet */
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .glass-box h2 {
            color: var(--mahogany);
            margin-bottom: 15px;
            font-size: 1.6rem;
            line-height: 1.3;
        }

        .glass-box p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: var(--dark-blue);
        }

        /* === TYPOGRAPHY & LIST === */
        .title-hero {
            color: var(--dark-blue);
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 800;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(255,255,255,0.5);
            margin-bottom: 30px;
            line-height: 1.2;
        }
        .title-hero span { color: var(--cream); text-shadow: 2px 2px 8px rgba(0,0,0,0.1); }

        .arahan-list {
            text-align: left;
            margin: 15px 0;
            padding-left: 20px;
            line-height: 1.6;
            font-weight: 500;
        }
        .arahan-list li { margin-bottom: 10px; }

        /* === TOMBOL UTAMA & NAVIGASI === */
        .btn-primary {
            background: var(--mahogany);
            color: var(--cream);
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 46, 43, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 8px 25px rgba(74, 46, 43, 0.4);
        }

        /* Tata letak tombol navigasi agar tidak numpuk teks di HP */
        .nav-container {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        /* === FORM LOGIN === */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(162, 196, 201, 0.5);
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            font-size: 1rem;
            color: var(--dark-blue);
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--sage-green);
            background: #fff;
            box-shadow: 0 0 10px rgba(132, 156, 126, 0.2);
        }

        /* === MENU UTAMA (HALAMAN 4) === */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .menu-card {
            background: var(--cream);
            border: 2px solid var(--sage-green);
            border-radius: 16px;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark-blue);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .menu-card:hover {
            transform: translateY(-4px);
            background: #f4f0e6;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .menu-icon { font-size: 2rem; }

        /* === DAFTAR GAME === */
        .game-category {
            text-align: left;
            margin-bottom: 20px;
        }
        .game-category h3 {
            color: var(--mahogany);
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .game-link {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(162, 196, 201, 0.4);
            color: var(--dark-blue);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .game-link:hover { background: rgba(162, 196, 201, 0.8); }

        /* === CHATBOT AI === */
        .chat-area {
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--light-blue);
            border-radius: 16px;
            height: 280px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .bubble {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .ai-bubble {
            background: var(--light-blue);
            color: var(--dark-blue);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-bubble {
            background: var(--sage-green);
            color: var(--cream);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
